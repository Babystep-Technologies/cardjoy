services:
  api:
    build:
      context: ./api
      dockerfile: dockerfiles/dev.Dockerfile
    volumes:
      - ./api:/app/api
    ports:
      - "3000:3000"
    stdin_open: true
    depends_on:
      - db
      - redis
    networks:
      - cardjoy-network-local
    tty: true
    command: tail -f /dev/null
    environment:
      - REDIS_URL=redis://redis:6379/0
      # Local-only JWT signing secret. config/credentials/development.key is
      # gitignored, so credentials decrypt to {} on a fresh clone and sign-in
      # would mint tokens the API can never verify. Not a real secret — deployed
      # environments read theirs from credentials.
      - JWT_SECRET_KEY=local-development-jwt-secret-do-not-use-in-production
      # Must match web/.env.development's VITE_GOOGLE_CLIENT_ID: the browser
      # gets an ID token for this client, and the API validates it against the
      # same one. Without it Google sign-in fails with "Invalid Google token".
      # A public client ID, not a secret — Google sign-in here is token-based
      # and uses no client secret.
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-577617815739-khjjo3bv6e673en0rth3rgrpt56gr9lc.apps.googleusercontent.com}
  db:
    image: postgres:14.2
    ports:
      - "5432:5432"
    networks:
      - cardjoy-network-local
    volumes:
      - cardjoy-db:/var/lib/postgresql/data
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
      user: postgres
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - cardjoy-network-local
    volumes:
      - cardjoy-redis:/data
    command: redis-server --appendonly yes
  web:
    build: ./web
    volumes:
      - ./web:/app/web
        # Anonymous volume shadows the bind mount so the image's installed
        # node_modules (from `yarn install`) are used, not the host's.
      - /app/web/node_modules
    ports:
      - "3001:3001"
      - "5173:5173"
    environment:
      - NODE_ENV=development
    # depends_on:
    #   - api
    networks:
      - cardjoy-network-local
    command: tail -f /dev/null
    # this is needed for having react server available
    stdin_open: true
  admin:
    build: ./admin
    volumes:
      - ./admin:/app/admin
        # Anonymous volume shadows the bind mount so the image's installed
        # node_modules (from `yarn install`) are used, not the host's.
      - /app/admin/node_modules
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=development
    # depends_on:
    #   - api
    networks:
      - cardjoy-network-local
    command: tail -f /dev/null
    # this is needed for having react server available
    stdin_open: true
volumes:
  cardjoy-db:
  cardjoy-redis:
networks:
  cardjoy-network-local:
    name: cardjoy_network_local
