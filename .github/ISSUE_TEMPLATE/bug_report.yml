name: Bug report
description: Report something that isn't working as expected.
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill in the sections below so we (and any
        AI assistant that picks this up) can reproduce and fix it quickly.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: A clear, concise description of the bug.
      placeholder: When I click "Create card" the page shows a blank screen.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the app is affected?
      options:
        - web (consumer app)
        - admin (dashboard)
        - api (Rails/GraphQL backend)
        - not sure
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered steps that reliably trigger the bug.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened? Include full error messages / stack traces if you have them.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Where did you see this? (hosted cardjoy.app or local Docker; browser; OS)
      placeholder: |
        - Where: local (`make dev`) / cardjoy.app
        - Browser: Chrome 130
        - OS: macOS 15
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, logs, or anything else that helps.
    validations:
      required: false
