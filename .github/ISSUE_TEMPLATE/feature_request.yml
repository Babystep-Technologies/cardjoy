name: Feature request / proposal
description: Propose a new feature or improvement.
title: "[Feature]: "
labels: ["feature-request", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea! Well-specified proposals can be picked up quickly — including by an AI
        assistant once a maintainer accepts them. Please be concrete, especially in **Acceptance
        criteria**.
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What problem does this solve, or what's the use case? Who benefits?
      placeholder: As an organizer, I want to schedule a card to send later so that...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the feature and, if you can, how it should work.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part(s) of the app would this touch?
      multiple: true
      options:
        - web (consumer app)
        - admin (dashboard)
        - api (Rails/GraphQL backend)
        - not sure
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: >
        A checklist of concrete, verifiable outcomes that mean this is "done". This is what a
        reviewer (or an AI implementer) will build and test against — the more precise, the better.
      value: |
        - [ ]
        - [ ]
        - [ ]
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about, and why you prefer this one.
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Mockups, links, or related issues.
    validations:
      required: false
