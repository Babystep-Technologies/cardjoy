test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>

local:
  service: Disk
  root: <%= Rails.root.join("storage") %>

staging:
  service: GCS
  project: <%= Rails.application.credentials.dig(:google, :project_id) %>
  credentials: <%= Rails.root.join("config/service-account-key.json") %>
  bucket: <%= Rails.application.credentials.dig(:google, :storage_bucket) %>

production:
  service: GCS
  # Read from environment variables in production, falling back to encrypted
  # credentials elsewhere. When no service-account-key.json is present, the GCS
  # client uses Application Default Credentials, so no key file needs to be shipped.
  project: <%= ENV.fetch("GCS_PROJECT") { Rails.application.credentials.dig(:google, :project_id) } %>
<% sa_key = Rails.root.join("config/service-account-key.json") %>
<% if File.exist?(sa_key) %>
  credentials: <%= sa_key %>
<% end %>
  bucket: <%= ENV.fetch("GCS_BUCKET") { Rails.application.credentials.dig(:google, :storage_bucket) } %>
