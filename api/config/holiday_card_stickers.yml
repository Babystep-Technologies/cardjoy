# Standardized design elements a holiday card can drop into a template's
# sticker regions.
#
# `asset` is a filename under app/assets/holiday_card_stickers. The assets are
# SVG and live in the API, not in web/public, because both consumers read them
# from here: the print renderer inlines them as base64, and the editor fetches
# them over GraphQL as a data URI (HolidayCardStickerType#data_uri). One copy,
# versioned with the code that positions it.
#
# Categories are free-form strings; the editor groups the picker by them.
# Adding a sticker is an entry here plus an SVG — no migration, no model change.

- id: snowflake_fine
  name: Fine Snowflake
  category: snowflakes
  asset: snowflake_fine.svg

- id: snowflake_bold
  name: Bold Snowflake
  category: snowflakes
  asset: snowflake_bold.svg

- id: snowflake_cluster
  name: Snowflake Cluster
