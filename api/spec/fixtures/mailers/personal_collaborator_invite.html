<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta name="supported-color-schemes" content="light" />
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400&display=swap');
      @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@700&display=swap');

      body {
        margin: 0;
        padding: 0;
        font-family: 'Poppins', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
        line-height: 1.5;
        background-color: #fefaf9;
        color: #573b6f;
        -webkit-text-size-adjust: 100%;
        -ms-text-size-adjust: 100%;
      }

      h1, h2, h3 {
        font-family: 'Source Serif 4', Georgia, 'Times New Roman', serif;
        font-weight: 700;
        line-height: 1.25;
      }

      img {
        max-width: 100%;
        height: auto;
        border: 0;
      }

      /* Keeps a card from touching the screen edge when the viewport is narrower than the card. */
      .container {
        padding: 0 12px;
      }

      .logo-wrapper {
        text-align: center;
        padding-top: 24px;
        padding-bottom: 12px;
      }

      .logo-wrapper img {
        width: 160px;
        height: auto;
      }

      .card {
        background-color: #ffffff; /* oklch(1 0 0) */
        color: #2b2c4b; /* oklch(0.141 0.005 285.823) approx */
        padding: 24px;
        border-radius: 12px;
        max-width: 600px;
        margin: 0 auto 40px auto;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
        box-sizing: border-box;
        overflow-wrap: break-word;
        word-wrap: break-word;
      }

      .primary-button {
        display: inline-block;
        background-color: transparent;
        color: #433c69;
        padding: 12px 24px;
        border-radius: 6px;
        border: 2px solid #433c69;
        text-decoration: none;
        font-weight: 600;
        text-align: center;
      }

      /* One option per "add to calendar" service. Inline with room around each so a wrapped row
         still has even gaps; stacked full-width on phones (see the media query). */
      .cal-buttons {
        margin: 12px 0 20px 0;
      }

      .cal-btn {
        display: inline-block;
        margin: 0 10px 12px 0;
        padding: 10px 20px;
        border-radius: 6px;
        border: 2px solid #999;
        text-decoration: none;
        font-weight: 600;
        font-size: 14px;
        text-align: center;
      }

      a {
        color: #433c69;
      }

      .footer {
        text-align: center;
        font-size: 12px;
        color: #999;
        margin-bottom: 24px;
        padding: 0 16px;
      }

      @media only screen and (max-width: 480px) {
        .container {
          padding: 0 8px;
        }

        .card {
          padding: 20px 16px;
          border-radius: 10px;
        }

        .primary-button,
        .cal-btn {
          display: block;
          width: 100%;
          box-sizing: border-box;
          margin-right: 0;
        }

        .cal-btn {
          margin-bottom: 10px;
          padding: 12px 16px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
        <div class="logo-wrapper">
          <img src="https://cdn.example.com/logo.gif" alt="CardJoy Logo" />
        </div>

      <div class="card">
        <!-- collaborator_invite.html.erb -->
<p>You’ve been invited to write a message for <strong>Test Card</strong>!</p>
<p>Click here to contribute: <a href="https://example.com/card/ABCDEFG/editable">View Card</a></p>

      </div>

      <div class="footer">
        © 2026 BabyStep Technologies, Inc. All rights reserved.
      </div>
    </div>
  </body>
</html>
