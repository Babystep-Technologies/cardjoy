<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400&display=swap');
      @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@700&display=swap');

      body {
        margin: 0;
        padding: 0;
        font-family: 'Poppins', sans-serif;
        background-color: #fefaf9;
        color: #573b6f;
      }

      h1, h2, h3 {
        font-family: 'Source Serif 4', serif;
        font-weight: 700;
      }

      .logo-wrapper {
        text-align: center;
        padding-top: 24px;
        padding-bottom: 12px;
      }

      .logo-wrapper img {
        width: 160px;
        height: auto;
      }

      .card {
        background-color: #ffffff; /* oklch(1 0 0) */
        color: #2b2c4b; /* oklch(0.141 0.005 285.823) approx */
        padding: 24px;
        border-radius: 12px;
        max-width: 600px;
        margin: 0 auto 40px auto;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
      }

      .primary-button {
        display: inline-block;
        background-color: transparent;
        color: #433c69;
        padding: 12px 24px;
        border-radius: 6px;
        border: 2px solid #433c69;
        text-decoration: none;
        font-weight: 600;
      }

      a {
        color: #433c69;
      }

      .footer {
        text-align: center;
        font-size: 12px;
        color: #999;
        margin-bottom: 24px;
      }
    </style>
  </head>
  <body>
      <div class="logo-wrapper">
        <img src="https://cdn.example.com/logo.gif" alt="CardJoy Logo" />
      </div>

    <div class="card">
      <!-- collaborator_invite.html.erb -->
<p>You’ve been invited to write a message for <strong>Test Card</strong>!</p>
<p>Click here to contribute: <a href="https://example.com/card/ABCDEFG/editable">View Card</a></p>

    </div>

    <div class="footer">
      © 2026 BabyStep Technologies, Inc. All rights reserved.
    </div>
  </body>
</html>
